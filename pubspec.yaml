name: kavita
description: "A quiet place for poems, in two tongues."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  flutter_riverpod: ^2.5.1

  # Talks to the Django backend (login, signup, fetching poems).
  http: ^1.2.1

  # Stores the JWT access/refresh tokens on-device, encrypted, so the
  # person doesn't have to log in every time they open the app.
  flutter_secure_storage: ^9.2.2

  record: ^5.1.2
  just_audio: ^0.9.40
  audio_waveforms: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true